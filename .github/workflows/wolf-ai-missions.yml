name: WOLF AI — Approved Mission Worker
run-name: "WOLF mission processing • ${{ github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect queue or process previously approved GitHub Issues
        type: choice
        options: [inspect, run]
        required: true
        default: inspect
  schedule:
    - cron: '17 */2 * * *' # Finite every-2-hours check, never a permanent runner.

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: wolf-issue-missions
  cancel-in-progress: false

jobs:
  approved-missions:
    if: github.repository == '19wolfalone92/WOLF-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout trusted code (no persisted credentials)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify state-machine safety and existing regression tests
        run: python -B -m unittest discover -s tests -p 'test_wolf*.py' -v
      - name: Poll approved Issue missions (no arbitrary commands)
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wolf-missions"
          if [[ "$EVENT_NAME" == "schedule" || "$REQUESTED_MODE" == "run" ]]; then
            python -B -m wolf_ai.missions --report \
              "$RUNNER_TEMP/wolf-missions/mission_receipt.json" --run
          else
            python -B -m wolf_ai.missions --report \
              "$RUNNER_TEMP/wolf-missions/mission_receipt.json"
          fi
      - name: Keep bounded receipt regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolf-missions-${{ github.run_id }}
          path: ${{ runner.temp }}/wolf-missions/
          if-no-files-found: warn
          retention-days: 14
