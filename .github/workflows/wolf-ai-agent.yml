name: WOLF AI — Agent v6 (Plan / Act / Verify)
run-name: "WOLF agent ${{ inputs.project || 'wolf' }} ${{ inputs.mode || 'test' }} ${{ inputs.client_task_id || 'PR-smoke' }}"

on:
  workflow_dispatch:
    inputs:
      project:
        description: Fixed repo allowlist, never arbitrary URLs
        type: choice
        options: [wolf, studio, shaira, williams, williams-ai, english-child]
        required: true
        default: wolf
      mode:
        description: Diagnostic audit or full configured tests
        type: choice
        options: [audit, test]
        required: true
        default: test
      goal:
        description: User-approved description (will reach GitHub; no private data)
        type: string
        required: true
        default: Проверь проект и предложи дальнейшие шаги
      client_task_id:
        description: Opaque per-task identifier; no commands
        type: string
        required: true
        default: manual
      safe_fix:
        description: Allow bounded local Ruff patch (only wolf+test; never pushes or merges)
        type: boolean
        required: true
        default: false
  pull_request:
    paths:
      - 'wolf_ai/agent_engine.py'
      - 'tests/test_wolf_agent.py'
      - '.github/workflows/wolf-ai-agent.yml'

permissions:
  contents: read

concurrency:
  group: wolf-agent-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.client_task_id || github.run_id }}
  cancel-in-progress: false

jobs:
  agent-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Agent and existing WOLF regression suite
        run: python -B -m unittest discover -s tests -p 'test_wolf*.py' -v

  approved-agent:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == '19wolfalone92/WOLF-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      PROJECT: ${{ inputs.project }}
      MODE: ${{ inputs.mode }}
      GOAL: ${{ inputs.goal }}
      SAFE_FIX: ${{ inputs.safe_fix }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout trusted WOLF engine
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify agent security and regression tests
        run: python -B -m unittest discover -s tests -p 'test_wolf*.py' -v
      - name: Resolve target from exact repository allowlist
        shell: bash
        run: |
          set -euo pipefail
          case "$PROJECT" in
            wolf) echo 'TARGET_REPO=19wolfalone92/WOLF-AI' >> "$GITHUB_ENV" ;;
            studio) echo 'TARGET_REPO=19wolfalone92/Two-Worlds-Studio' >> "$GITHUB_ENV" ;;
            shaira) echo 'TARGET_REPO=19wolfalone92/Shaira' >> "$GITHUB_ENV" ;;
            williams) echo 'TARGET_REPO=19wolfalone92/Williams' >> "$GITHUB_ENV" ;;
            williams-ai) echo 'TARGET_REPO=19wolfalone92/Williams-AI' >> "$GITHUB_ENV" ;;
            english-child) echo 'TARGET_REPO=19wolfalone92/English_Child' >> "$GITHUB_ENV" ;;
            *) echo '::error::Unknown project'; exit 2 ;;
          esac
          if [[ "$SAFE_FIX" == "true" && ( "$PROJECT" != "wolf" || "$MODE" != "test" ) ]]; then
            echo '::error::Auto-fix requires wolf/test, never another repository'
            exit 2
          fi
      - name: Checkout selected target without write credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          path: target
          persist-credentials: false
      - name: Use Node 22 for Shaira checks
        if: env.PROJECT == 'shaira'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Studio runtime for configured checks
        if: env.PROJECT == 'studio'
        run: python -m pip install -r target/requirements.txt
      - name: Optional pinned local-only Python fixer
        if: env.SAFE_FIX == 'true'
        run: python -m pip install 'ruff==0.14.3'
      - name: Execute bounded agent reasoning / tools / evidence / verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wolf-agent-v6"
          extra=()
          if [[ "$SAFE_FIX" == "true" ]]; then extra+=(--allow-safe-fix); fi
          python -B -m wolf_ai.agent_engine \
            --project "$PROJECT" --mode "$MODE" --goal "$GOAL" \
            --source target --output "$RUNNER_TEMP/wolf-agent-v6/agent_report.json" \
            --budget-seconds 750 "${extra[@]}"
      - name: Preserve checkpointed report and verified patch even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolf-agent-v6-${{ github.run_id }}
          path: ${{ runner.temp }}/wolf-agent-v6/
          retention-days: 21
          if-no-files-found: warn
