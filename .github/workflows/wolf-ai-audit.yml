name: WOLF AI — free-first project audit
run-name: "WOLF ${{ github.event_name == 'schedule' && github.event.schedule == '15 3 * * *' && 'wolf' || inputs.project || 'studio' }} ${{ github.event_name == 'schedule' && github.event.schedule == '15 3 * * *' && 'test' || inputs.mode || 'audit' }} ${{ inputs.client_task_id || 'periodic' }}"

on:
  workflow_dispatch:
    inputs:
      project:
        description: Which repository to inspect (never mutate)
        type: choice
        options: [wolf, studio, shaira, williams, williams-ai, english-child]
        required: true
        default: studio
      client_task_id:
        description: 'Optional opaque UUID from WOLF AI Android (no commands)'
        type: string
        required: false
        default: 'manual'
      mode:
        description: Test commands or lighter audit
        type: choice
        options: [audit, test]
        required: true
        default: audit
  schedule:
    - cron: '30 6 * * 1' # Weekly Studio audit.
    - cron: '15 3 * * *' # Daily self-health check of WOLF AI (read-only).
  pull_request:
    paths:
      - 'wolf_ai/**'
      - 'tests/test_wolf*.py'
      - '.github/workflows/wolf-ai-audit.yml'
      - '.github/workflows/wolf-ai-repair.yml'

permissions:
  contents: read

concurrency:
  group: wolf-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PROJECT: ${{ github.event_name == 'workflow_dispatch' && inputs.project || (github.event_name == 'schedule' && github.event.schedule == '15 3 * * *' && 'wolf' || 'studio') }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'schedule' && github.event.schedule == '15 3 * * *' && 'test' || 'audit') }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test WOLF safety contracts
        run: python -m unittest discover -s tests -p 'test_wolf*.py' -v
      - name: Select authorized repo from fixed allowlist
        shell: bash
        run: |
          case "$PROJECT" in
            wolf) echo 'TARGET_REPO=19wolfalone92/WOLF-AI' >> "$GITHUB_ENV" ;;
            studio) echo 'TARGET_REPO=19wolfalone92/Two-Worlds-Studio' >> "$GITHUB_ENV" ;;
            shaira) echo 'TARGET_REPO=19wolfalone92/Shaira' >> "$GITHUB_ENV" ;;
            williams) echo 'TARGET_REPO=19wolfalone92/Williams' >> "$GITHUB_ENV" ;;
            williams-ai) echo 'TARGET_REPO=19wolfalone92/Williams-AI' >> "$GITHUB_ENV" ;;
            english-child) echo 'TARGET_REPO=19wolfalone92/English_Child' >> "$GITHUB_ENV" ;;
            *) exit 2 ;;
          esac
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.PROJECT == 'shaira'
        with:
          node-version: '22'
      - name: Install local studio dependencies
        if: env.PROJECT == 'studio'
        run: python -m pip install -r target/requirements.txt
      - name: Check selected project without writing back
        shell: bash
        run: |
          mkdir -p wolf-report
          python -m wolf_ai.orchestrator --project "$PROJECT" --mode "$MODE" \
            --source target --output wolf-report/audit.json --execute --budget-seconds 600
      - name: Upload audit receipt, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolf-audit-${{ github.run_id }}
          path: wolf-report/
          if-no-files-found: warn
          retention-days: 7

  repair-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout PR (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local pinned Ruff
        run: python -m pip install 'ruff==0.14.3'
      - name: Simulate bounded repairs on disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_wolf*.py' -v
          python -B -m wolf_ai.repair_engine --repo . \
            --report "$RUNNER_TEMP/wolf-repair-sim.json" --apply
          python -B -m unittest discover -s tests -p 'test_wolf*.py' -v
          ruff check --select E4,E7,E9,F821,F401,I wolf_ai tests
          echo "Smoke run completed on disposable runner; zero GitHub write permissions."
      - name: Upload non-destructive test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolf-repair-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/wolf-repair-sim.json
          if-no-files-found: warn
          retention-days: 7
