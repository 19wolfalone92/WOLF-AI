name: WOLF AI Android — Build APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'wolf_ai/train_router.py'
      - 'training/tasks.jsonl'
      - '.github/workflows/wolf-ai-android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'wolf_ai/train_router.py'
      - 'training/tasks.jsonl'
      - '.github/workflows/wolf-ai-android.yml'

permissions:
  contents: read

concurrency:
  group: wolf-ai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test actual Russian chat intent routing on JVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wolf-chat-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/wolf-chat-tests" \
            android/app/src/main/java/ai/wolf/autopilot/WolfCommandRouter.java \
            tests/java/WolfCommandRouterTest.java
          java -ea -cp "$RUNNER_TEMP/wolf-chat-tests" \
            ai.wolf.autopilot.WolfCommandRouterTest
      - name: Test actual web search result parser on JVM (no internet needed)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wolf-search-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/wolf-search-tests" \
            android/app/src/main/java/ai/wolf/autopilot/WebSearchService.java \
            tests/java/WebSearchServiceTest.java
          java -ea -cp "$RUNNER_TEMP/wolf-search-tests" \
            ai.wolf.autopilot.WebSearchServiceTest
      - name: Test bulk Metricool scheduling parser on JVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wolf-batch-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/wolf-batch-tests" \
            android/app/src/main/java/ai/wolf/autopilot/MetricoolBatchParser.java \
            tests/java/MetricoolBatchParserTest.java
          java -ea -cp "$RUNNER_TEMP/wolf-batch-tests" \
            ai.wolf.autopilot.MetricoolBatchParserTest
      - name: Test real assisted navigation policy on JVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wolf-ui-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/wolf-ui-tests" \
            android/app/src/main/java/ai/wolf/autopilot/AssistivePolicy.java \
            android/app/src/main/java/ai/wolf/autopilot/AssistiveCommandParser.java \
            android/app/src/main/java/ai/wolf/autopilot/BrowserActionPolicy.java \
            android/app/src/main/java/ai/wolf/autopilot/BrowserFlowPlan.java \
            android/app/src/main/java/ai/wolf/autopilot/CloudBrowserCommand.java \
            android/app/src/main/java/ai/wolf/autopilot/WolfCommandRouter.java \
            tests/java/AssistedNavigationTest.java
          java -ea -cp "$RUNNER_TEMP/wolf-ui-tests" \
            ai.wolf.autopilot.AssistedNavigationTest
      - name: Test real hybrid inference and authenticated draft safety on JVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wolf-hybrid-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/wolf-hybrid-tests" \
            android/app/src/main/java/ai/wolf/autopilot/AssistivePolicy.java \
            android/app/src/main/java/ai/wolf/autopilot/BrowserActionPolicy.java \
            android/app/src/main/java/ai/wolf/autopilot/CloudBrainPolicy.java \
            android/app/src/main/java/ai/wolf/autopilot/AuthenticatedFormPolicy.java \
            tests/java/WolfHybridBrainTest.java
          java -ea -cp "$RUNNER_TEMP/wolf-hybrid-tests" \
            ai.wolf.autopilot.WolfHybridBrainTest
      - name: Test private browser profile safety on Python
        shell: bash
        run: |
          python3 -B -m unittest discover -s tests -p 'test_wolf_private_browser.py' -v
      - name: Test 0-fee model catalog and chat commands on JVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wolf-free-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/wolf-free-tests" \
            android/app/src/main/java/ai/wolf/autopilot/OfflineModelCatalog.java \
            android/app/src/main/java/ai/wolf/autopilot/WolfCommandRouter.java \
            tests/java/WolfFreeFirstTest.java
          java -ea -cp "$RUNNER_TEMP/wolf-free-tests" \
            ai.wolf.autopilot.WolfFreeFirstTest
      - name: Verify free-only Android enforcement and 3-pass local inference
        shell: bash
        run: |
          python3 -B -m unittest discover -s tests -p 'test_wolf_free_first_v15.py' -v
      - name: Test real depth and TikTok chat routing on JVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wolf-studio-routing"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/wolf-studio-routing" \
            android/app/src/main/java/ai/wolf/autopilot/WolfCommandRouter.java \
            tests/java/WolfDepthTikTokTest.java
          java -ea -cp "$RUNNER_TEMP/wolf-studio-routing" \
            ai.wolf.autopilot.WolfDepthTikTokTest
      - name: Test true depth configuration and direct TikTok Studio Android behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_wolf_tiktok_depth_v16.py' -v
      - name: Test local private TikTok Studio uploader without account/network
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_wolf_tiktok_studio_v16.py' -v
      - name: Verify REAL WOLF workspace backup encryption on JVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wolf-crypto-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/wolf-crypto-tests" \
            android/app/src/main/java/ai/wolf/autopilot/WorkspaceCrypto.java \
            tests/java/WorkspaceCryptoTest.java
          java -ea -cp "$RUNNER_TEMP/wolf-crypto-tests" \
            ai.wolf.autopilot.WorkspaceCryptoTest
      - name: Android SDK (supported setup action)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Android NDK and CMake for embedded llama.cpp
        run: sdkmanager "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Pin and fetch upstream open-source llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/third_party/llama.cpp
          cd android/third_party/llama.cpp
          git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git -c protocol.version=2 fetch --no-tags --depth 1 origin e95426f16982054c379ca7bdc8186996dd22f0fe
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "e95426f16982054c379ca7bdc8186996dd22f0fe"
          test -s include/llama.h
      - name: Bundle licensed Qwen weights inside APK (no runtime model downloads)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          curl --fail --location --retry 5 --retry-delay 5 --connect-timeout 30 \
            -o android/app/src/main/assets/qwen2.5-coder-0.5b-instruct-q4_0.gguf \
            https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-0.5b-instruct-q4_0.gguf
          printf '%s  %s\n' \
            '9739055e046d62a937e5b7879012209ef40ebea8a1569a96028de491f3f091d5' \
            android/app/src/main/assets/qwen2.5-coder-0.5b-instruct-q4_0.gguf | sha256sum -c -
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/ggml-org/llama.cpp/e95426f16982054c379ca7bdc8186996dd22f0fe/LICENSE \
            -o android/app/src/main/assets/LLAMA_CPP_LICENSE.txt
          curl --fail --location --retry 3 \
            https://www.apache.org/licenses/LICENSE-2.0.txt \
            -o android/app/src/main/assets/QWEN_LICENSE.txt
      - name: Python 3.11 for offline router training
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Train and bundle intent model INSIDE Android APK
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_wolf_training.py' -v
          python -B -m wolf_ai.train_router --examples training/tasks.jsonl \
            --output android/app/src/main/assets
          test -s android/app/src/main/assets/task_router_model.json
          test -s android/app/src/main/assets/training_report.json
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify standalone app source and audit interface
        run: |
          test -s android/app/src/main/java/ai/wolf/autopilot/GithubOperations.java
          test -s android/app/src/main/cpp/wolf_native.cpp
          test -s android/app/src/main/java/ai/wolf/autopilot/EmbeddedAi.java
          grep -F "client_task_id" .github/workflows/wolf-ai-audit.yml
      - name: Compile Android APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Verify manifest and APK package
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F 'assets/qwen2.5-coder-0.5b-instruct-q4_0.gguf'
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libwolf_native.so'
          unzip -l "$apk" | grep -F 'assets/task_router_model.json'
          test "$(stat -c%s "$apk")" -gt 400000000
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='ai.wolf.autopilot'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | tee /tmp/wolf-permissions.txt
          grep -F "android.permission.INTERNET" /tmp/wolf-permissions.txt
          if grep -E "READ_SMS|READ_CONTACTS|ACCESS_FINE_LOCATION|QUERY_ALL_PACKAGES" /tmp/wolf-permissions.txt; then
            echo "Unexpected high-risk Android permission" >&2
            exit 2
          fi
          sha256sum "$apk" | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Restore optional persistent release signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          WOLF_KEYSTORE_B64: ${{ secrets.WOLF_RELEASE_KEYSTORE_B64 }}
          WOLF_STORE_PASSWORD: ${{ secrets.WOLF_STORE_PASSWORD }}
          WOLF_KEY_ALIAS: ${{ secrets.WOLF_KEY_ALIAS }}
          WOLF_KEY_PASSWORD: ${{ secrets.WOLF_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$WOLF_KEYSTORE_B64" && -n "$WOLF_STORE_PASSWORD" &&
                -n "$WOLF_KEY_ALIAS" && -n "$WOLF_KEY_PASSWORD" ]]; then
            printf '%s' "$WOLF_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/wolf-release.jks"
            chmod 600 "$RUNNER_TEMP/wolf-release.jks"
            test -s "$RUNNER_TEMP/wolf-release.jks"
            echo "WOLF_RELEASE_STORE_FILE=$RUNNER_TEMP/wolf-release.jks" >> "$GITHUB_ENV"
            echo "Persistent signing material configured (no credentials printed)."
          else
            echo "::notice::Stable release signing is not configured. Debug APK only."
          fi
      - name: Build optional stable signed release APK
        if: github.ref == 'refs/heads/main' && env.WOLF_RELEASE_STORE_FILE != ''
        env:
          WOLF_STORE_PASSWORD: ${{ secrets.WOLF_STORE_PASSWORD }}
          WOLF_KEY_ALIAS: ${{ secrets.WOLF_KEY_ALIAS }}
          WOLF_KEY_PASSWORD: ${{ secrets.WOLF_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android :app:assembleRelease
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --print-certs "$apk" > "$RUNNER_TEMP/wolf-release-verify.txt"
          grep -F 'Verified using v2 scheme' "$RUNNER_TEMP/wolf-release-verify.txt"
          sha256sum "$apk" > android/app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Upload persistent signed release APK (only if configured)
        if: github.ref == 'refs/heads/main' && env.WOLF_RELEASE_STORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: WOLF-AI-Android-signed-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WOLF-AI-Android-debug-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/src/main/assets/training_report.json
          if-no-files-found: error
          retention-days: 30
