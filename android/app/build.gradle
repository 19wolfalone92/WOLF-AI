plugins {
    id 'com.android.application'
}

def persistentStore = System.getenv('WOLF_RELEASE_STORE_FILE')
def persistentStorePass = System.getenv('WOLF_STORE_PASSWORD')
def persistentAlias = System.getenv('WOLF_KEY_ALIAS')
def persistentKeyPass = System.getenv('WOLF_KEY_PASSWORD')
def hasPersistentSigning = persistentStore && persistentStorePass && persistentAlias && persistentKeyPass

android {
    namespace 'ai.wolf.autopilot'
    compileSdk 35
    ndkVersion '29.0.13113456'

    defaultConfig {
        applicationId 'ai.wolf.autopilot'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '4.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    androidResources {
        noCompress += ['gguf']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        persistentRelease {
            if (hasPersistentSigning) {
                storeFile file(persistentStore)
                storePassword persistentStorePass
                keyAlias persistentAlias
                keyPassword persistentKeyPass
            }
        }
    }

    buildTypes {
        debug {
            // CI debug signing uses Android's ephemeral default keystore.
            // Never promise this package can upgrade a previous debug install.
        }
        release {
            minifyEnabled false
            if (hasPersistentSigning) {
                signingConfig signingConfigs.persistentRelease
            }
        }
    }
}
